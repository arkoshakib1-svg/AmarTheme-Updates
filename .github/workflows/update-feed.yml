name: Publish AmarTheme update feed
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Verify stable release and publish manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, tempfile
          repo = os.environ["REPO"]
          def api(path, *args):
              return json.loads(subprocess.check_output(["gh","api",path,*args], text=True))
          release = api(f"repos/{repo}/releases/latest")
          tag = release["tag_name"]
          if release["draft"] or release["prerelease"] or not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit("A published stable vX.Y.Z release is required")
          assets = [a for a in release["assets"]
                    if a["name"].startswith("AmarTheme") and a["name"].endswith("Setup.exe")
                    and a["size"] > 1024]
          if len(assets) != 1:
              raise SystemExit("Exactly one AmarTheme*Setup.exe asset required in this release")
          asset = assets[0]
          with tempfile.TemporaryDirectory() as d:
              subprocess.run(["gh","release","download",tag,"--repo",repo,"--pattern",asset["name"],"--dir",d],check=True)
              with open(pathlib.Path(d)/asset["name"],"rb") as stream:
                  digest = hashlib.file_digest(stream,"sha256").hexdigest()
          notes = release["body"] or "AmarTheme " + tag + " release"
          manifest = {
              "enabled": True,
              "version": tag[1:],
              "url": asset["browser_download_url"],
              "sha256": digest,
              "notes": notes,
              "download_url": asset["browser_download_url"],
              "release_notes": notes
          }
          old = api(f"repos/{repo}/contents/latest.json?ref=main")
          content = base64.b64encode((json.dumps(manifest,indent=2,ensure_ascii=False)+"\n").encode()).decode()
          api(f"repos/{repo}/contents/latest.json","--method","PUT","-f","branch=main",
              "-f","message=Publish verified AmarTheme update "+tag,
              "-f","sha="+old["sha"],"-f","content="+content)
          print("Published verified update feed for",tag,digest)
          PY
